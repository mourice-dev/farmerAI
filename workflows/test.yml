name: build and test

on:

 pull_request: 
     branches:
         -main
 
 push: 
 branches:
  -main

jobs:
 build-and-test: 
runs-on: ubuntu:latest

permession: 
  content: read
  package: write

  steps: 
    - name: checkeout
      use: actions/checkeout@v4

    - name: setup node
      use: actions/setup-node@v4
      with:
      node-version: '22'
      caches: 'npm'
      
   
      run: npm ci 
      run: npm run build --if-present
      run: npm test Suite
      run: npm test
