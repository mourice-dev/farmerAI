name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.10 is the floor: the codebase uses PEP 604 (`str | None`) in
        # evaluated function annotations.
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        # requirements-dev.txt pulls in requirements.txt, which routes torch to
        # the CPU wheel index. The CUDA build is ~2.5 GB and would blow the
        # runner's disk for no benefit here.
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Test
        # `python -m pytest`, not `pytest` -- the module form puts the repo root
        # on sys.path, which is how the suite imports `src`.
        run: python -m pytest tests/ -v
